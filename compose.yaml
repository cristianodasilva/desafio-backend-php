services:
  app:
    build: .
    working_dir: /var/www/html/src
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    command:
      - sh
      - -lc
      - php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: backend_test
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d backend_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
